# Piezas en preparacion. Se pintan debajo de la rejilla de /portfolio/ y, si
# tienen titulo_en, de /en/portfolio/. Al publicar una de ellas en _proyectos/,
# se quita de aqui.
- titulo: "La categoría que no existía"
  disciplinas: "Marca · Datos"
  resumen: "Cómo crucé datos de panel, de marketplace, reseñas de compradores y ventas propias para abrir una categoría de producto que el lineal español todavía no tenía, y que acabó pesando el 10&nbsp;% de la facturación de la marca."
  titulo_en: "The category that didn't exist"
  disciplinas_en: "Brand · Data"
  resumen_en: "How I combined panel data, marketplace data, buyer reviews and our own sales to open a product category Spanish retail didn't have yet, which grew to 10% of the brand's revenue."

- titulo: "De 9.300 referencias de SAP a una ficha de producto"
  disciplinas: "Datos"
  resumen: "La arquitectura de un proceso que lleva el catálogo desde SAP hasta la ficha que publican las tiendas, y lo que más costó: poner por escrito reglas de negocio que solo estaban en la cabeza de la gente."
  titulo_en: "From 9,300 SAP materials to one product page"
  disciplinas_en: "Data"
  resumen_en: "The pipeline that takes the catalogue from SAP to the product page retailers publish, and the hardest part: writing down business rules that only lived in people's heads."
