# Configuracion del sitio. Cambiar un valor aqui obliga a reiniciar el server local;
# en GitHub Pages basta con hacer push.

title: "Alejandro Campos Lamas"
tagline: "Insights, marca y datos"
description: >-
  Diez años preguntando por qué la gente compra lo que compra, primero en
  creatividad publicitaria y después al frente de una marca de gran consumo.
  Aquí escribo desde el proceso: insights, marca, datos e IA aplicada.
author:
  name: "Alejandro Campos Lamas"
  email: ""

# url = dominio raiz (sin barra final). baseurl = subcarpeta ("" si el sitio va en la raiz).
# Al conectar el dominio propio, cambiar url y crear el fichero CNAME.
url: "https://alejandrocamposlamas.com"
baseurl: ""

# Indexacion abierta desde el 2026-11-06 (primera pieza del portfolio publicada).
# true = el sitio es visible pero los buscadores lo ignoran.
noindex: false

lang: es

# Comillas rectas en todo el sitio: kramdown convierte por defecto "asi" en
# comillas curvas, y la norma de escritura pide rectas (2026-11-06).
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
timezone: Europe/Madrid

# Enlaces del perfil. Vacio = no se pinta.
linkedin: "alejandrocamposlamas"
github: "acamposla"

# /blog/2026/mi-titulo/ — sin dia, para que la URL no envejezca a la vista.
permalink: /blog/:year/:title/

# Plugins soportados de forma nativa por GitHub Pages (no requieren Actions).
# Anadir jekyll-paginate solo cuando el archivo pase de ~30 entradas.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# El portfolio es una coleccion, no entradas de blog: otro tipo de contenido,
# con sus propios campos y su propia plantilla. Mecanismo nativo de Jekyll.
collections:
  proyectos:
    output: true
    permalink: /portfolio/:name/

# Idioma por página: es en todo; en bajo /en/ y _proyectos/en/ (2026-11-09).
defaults:
  - scope:
      path: ""
    values:
      lang: es
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "_proyectos/en"
      type: proyectos
    values:
      lang: en
      permalink: /en/portfolio/:name/
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: proyectos
    values:
      layout: proyecto
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - CONTEXTO_CONVERSACION.md
  - scripts
  - vendor
