<script>
(function () {
  var fig = document.getElementById('diagrama-encargo');
  if (!fig) return;
  var detalle = fig.querySelector('.dg-detalle');
  var porDefecto = detalle.textContent;
  var textos = {
    encargo: "Lo dictas por voz, con las fotos de referencia y tus condiciones: qué modelo, borrador barato primero y que explique lo que hace.",
    plan: "Claude elige modelo y parámetros. Pedirle que razone la elección le obliga a comparar antes de lanzar.",
    generar: "Claude rellena los parámetros de la función de Higgsfield a través del MCP. Solo puede usar las funciones que el conector expone.",
    calidad: "Antes de enseñarte nada, Claude revisa el resultado contra tus reglas. Si las dos tomas no muestran el mismo producto, lo vuelve a pedir.",
    resultado: "Te llega el borrador en baja calidad. Con tu visto bueno, la versión en alta.",
    aprendizajes: "Al cerrar la sesión, Claude apunta en un fichero del proyecto qué funcionó y qué no.",
    skill: "Cuando esas reglas se repiten de un proyecto a otro, se empaquetan en una skill que Claude carga sola si el encargo se parece."
  };
  var nodos = fig.querySelectorAll('.dg-nodo');
  var aristas = fig.querySelectorAll('.dg-arista');
  var fijo = null;
  function activar(id) {
    fig.classList.toggle('activo', !!id);
    var vecinos = {};
    vecinos[id] = true;
    aristas.forEach(function (a) {
      var on = a.dataset.desde === id || a.dataset.hasta === id;
      a.classList.toggle('on', on);
      if (on) { vecinos[a.dataset.desde] = true; vecinos[a.dataset.hasta] = true; }
    });
    nodos.forEach(function (n) {
      n.classList.toggle('on', !!id && vecinos[n.dataset.id]);
      n.classList.toggle('actual', n.dataset.id === id);
    });
    detalle.textContent = id ? textos[id] : porDefecto;
  }
  nodos.forEach(function (n) {
    n.addEventListener('mouseenter', function () { if (!fijo) activar(n.dataset.id); });
    n.addEventListener('mouseleave', function () { if (!fijo) activar(null); });
    n.addEventListener('focus', function () { activar(n.dataset.id); });
    n.addEventListener('click', function () {
      fijo = fijo === n.dataset.id ? null : n.dataset.id;
      activar(fijo);
    });
  });
})();
</script>
